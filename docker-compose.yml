version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notary_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/notary.db
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY:-}
    volumes:
      - notary_data:/app/data
      - notary_keys:/app/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  notary_data:
    name: notary_sqlite_data
  notary_keys:
    name: notary_devnet_keys
